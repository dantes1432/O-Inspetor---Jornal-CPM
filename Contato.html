<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato - O Inspetor</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --fundo: #1c1c1e;
      --form-bg: #2c2c2e;
      --input-bg: #3a3a3c;
      --texto: #e5e5e7;
      --cinza-claro: #8e8e93;
      --destaque: #a47148;
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background-color: var(--fundo);
      color: var(--texto);
    }

    header {
      background-color: var(--form-bg);
      padding: 1.5rem;
      text-align: center;
      font-size: 1.8rem;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    .container {
      max-width: 600px;
      margin: 2rem auto;
      background-color: var(--form-bg);
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
    }

    h2 {
      margin-top: 0;
      color: var(--destaque);
    }

    label {
      display: block;
      margin-top: 1rem;
      font-weight: 600;
    }

    input, textarea {
      width: 100%;
      padding: 0.75rem;
      margin-top: 0.5rem;
      border: none;
      border-radius: 4px;
      background-color: var(--input-bg);
      color: var(--texto);
      font-size: 1rem;
    }

    button {
      margin-top: 1.5rem;
      padding: 0.75rem 2rem;
      background-color: var(--destaque);
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #925c3d;
    }

    footer {
      text-align: center;
      margin-top: 3rem;
      padding: 1rem;
      color: var(--cinza-claro);
    }
  </style>
</head>
<body>
  <header>Contato - O Inspetor</header>
  <div class="container">
    <h2>Fale conosco</h2>
    <form action="https://docs.google.com/forms/d/e/1FAIpQLSdAC2Xzfm-GGoQeJxqI8Wv2xeH4cry8MMagPuFJcXTRxbzSMQ/formResponse" method="POST" target="_blank">
      <label for="nome">Nome:</label>
      <input type="text" id="nome" name="entry.2005620554" required>

      <label for="email">E-mail:</label>
      <input type="email" id="email" name="entry.1045781291" required>

      <label for="mensagem">Mensagem:</label>
      <textarea id="mensagem" name="entry.839337160" rows="6" required></textarea>

      <button type="submit">Enviar</button>
    </form>
  </div>
  <footer>
    &copy; 2025 O Inspetor - Jornal do Colégio da Polícia Militar do Paraná
  </footer>
</body>
</html>
